name: Build and Release APK & Windows

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/build.gradle.kts
            android/app/build.gradle.kts

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis and tests
        run: |
          flutter analyze
          flutter test

      - name: Configure Android release signing (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare Android release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk "NotasApp-${{ github.ref_name }}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: NotasApp-${{ github.ref_name }}.apk

  build-windows:
    name: Build Windows Desktop ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests on Windows
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build Windows installer (.exe)
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v') -replace '-.*$', ''
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          & $iscc "/DAppTag=$tag" "/DAppVer=$ver" "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows release ZIP
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "NotasApp-Windows-$($env:GITHUB_REF_NAME).zip" -Force

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            NotasApp-Windows-${{ github.ref_name }}.zip
            NotasApp-Setup-${{ github.ref_name }}.exe

  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract release notes from README.md
        id: notes
        shell: bash
        run: |
          python3 - <<'EOF'
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          readme = open("README.md", encoding="utf-8").read()
          pattern = rf"(?ms)^### \[{re.escape(tag)}\](?:\s*-\s*([^\r\n]+))?\r?\n(.*?)(?=^### \[|^## |\Z)"
          match = re.search(pattern, readme)

          title = tag
          body = f"Nueva versión **{tag}** disponible."

          if match:
              if match.group(1):
                  title = f"{tag} - {match.group(1).strip()}"
              lines = [
                  line
                  for line in match.group(2).splitlines()
                  if "Enlace de Descarga:" not in line
              ]
              extracted = "\n".join(lines).strip()
              extracted = re.sub(r"(?:\r?\n---)+\s*$", "", extracted).strip()
              extracted = re.sub(r"\n{3,}", "\n\n", extracted)
              if extracted:
                  body = extracted

          title = title.replace("\r", " ").replace("\n", " ").strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"title={title}\n")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")
          EOF

      - name: Generate SHA-256 checksums
        run: |
          sha256sum "NotasApp-${{ github.ref_name }}.apk" "NotasApp-Setup-${{ github.ref_name }}.exe" "NotasApp-Windows-${{ github.ref_name }}.zip" > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release_notes.md
          files: |
            NotasApp-${{ github.ref_name }}.apk
            NotasApp-Setup-${{ github.ref_name }}.exe
            NotasApp-Windows-${{ github.ref_name }}.zip
            SHA256SUMS.txt
          draft: false
          prerelease: false
