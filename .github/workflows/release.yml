name: Build and Release APK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/build.gradle.kts
            android/app/build.gradle.kts

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis and tests
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk "NotasApp-${{ github.ref_name }}.apk"

      - name: Extract release notes from README.md
        id: notes
        shell: bash
        run: |
          python3 - <<'EOF'
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          readme = open("README.md", encoding="utf-8").read()
          pattern = rf"(?ms)^### \[{re.escape(tag)}\](?:\s*-\s*([^\r\n]+))?\r?\n(.*?)(?=^### \[|^## |\Z)"
          match = re.search(pattern, readme)

          title = tag
          body = f"Nueva versión **{tag}** disponible."

          if match:
              if match.group(1):
                  title = f"{tag} - {match.group(1).strip()}"
              lines = [
                  line
                  for line in match.group(2).splitlines()
                  if "Enlace de Descarga:" not in line
              ]
              extracted = "\n".join(lines).strip()
              extracted = re.sub(r"(?:\r?\n---)+\s*$", "", extracted).strip()
              extracted = re.sub(r"\n{3,}", "\n\n", extracted)
              if extracted:
                  body = extracted

          title = title.replace("\r", " ").replace("\n", " ").strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"title={title}\n")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release_notes.md
          files: NotasApp-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
